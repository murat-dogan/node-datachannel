name: Build - Linux

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [18]
        arch: [amd64, arm64]
        platform: [debian, alpine]
        include:
          # Platform-specific baselines
          - platform: alpine
            triple: alpine-linux-musl
            version: 3.16
            libc: musl
            gcc_install: clang lld
            gcc: clang
            gxx: clang++
            libc_suffix: musl
          - platform: debian
            triple: linux-gnu
            version: bullseye
            libc_suffix: gnu

          # Arch-specific baselines
          - arch: amd64
            triple_arch: x86_64
            node_arch: x64
          - arch: arm64
            triple_arch: aarch64
            node_arch: arm64
            flags: -march=armv8-a -fPIC

          # Platform + Arch overrides (needed for proper toolchain)
          - arch: amd64
            platform: debian
            gcc_install: gcc g++
            gcc: gcc
            gxx: g++
          - arch: arm64
            platform: debian
            gcc_install: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            gcc: aarch64-linux-gnu-gcc
            gxx: aarch64-linux-gnu-g++

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install node dependencies
        run: npm install --ignore-scripts
        env:
          CI: true

      - if: matrix.arch != 'amd64'
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y podman

      - name: Prepare build container
        run: >
          sudo podman build
          --isolation=chroot
          -t ndc-buildroot:${{ matrix.platform }}-${{ matrix.arch }}
          ./build-containers
          --file Dockerfile.${{ matrix.platform }}
          --platform linux/${{ matrix.arch }}
          --build-arg version=${{ matrix.version }}
          --build-arg node_version=${{ matrix.node-version }}
          --build-arg gcc_install="${{ matrix.gcc_install }}"

      - name: Build
        run: |
          sudo podman run --rm \
            -e TRIPLE=${{ matrix.triple_arch }}-${{ matrix.triple }}${{ matrix.triple_postfix }} \
            -e COMPILER_FLAGS="${{ matrix.flags }}" \
            -e LIBC=${{ matrix.libc }} \
            -e GCC=${{ matrix.gcc }} \
            -e GXX=${{ matrix.gxx }} \
            -e CI=true \
            -v ${{ github.workspace }}:/usr/app \
            --platform linux/${{ matrix.arch }} \
            -w /usr/app \
            ndc-buildroot:${{ matrix.platform }}-${{ matrix.arch }} \
            npx cmake-js build --CDCMAKE_TOOLCHAIN_FILE:FILEPATH=./cmake/toolchain/ci.cmake

      - name: Test
        run: >
          sudo podman run --rm
          -v ${{ github.workspace }}:/usr/app/
          -e CI=true
          --platform linux/${{ matrix.arch }}
          -t ndc-buildroot:${{ matrix.platform }}-${{ matrix.arch }}
          npm run test

      - name: Package Platform
        run: node scripts/prepare-platform-packages.js linux-${{ matrix.node_arch }}-${{ matrix.libc_suffix }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.node_arch }}-${{ matrix.libc_suffix }}
          path: npm/linux-${{ matrix.node_arch }}-${{ matrix.libc_suffix }}
