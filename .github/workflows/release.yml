name: Release & Publish

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (${{ matrix.platform }}-${{ matrix.node_arch }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [24]
        arch: [amd64, arm64]
        platform: [debian, alpine]
        include:
          - platform: alpine
            triple: alpine-linux-musl
            version: 3.24
            libc: musl
            gcc_install: clang lld
            gcc: clang
            gxx: clang++
            libc_suffix: musl
          - platform: debian
            triple: linux-gnu
            version: trixie
            libc_suffix: gnu
          - arch: amd64
            triple_arch: x86_64
            node_arch: x64
          - arch: arm64
            triple_arch: aarch64
            node_arch: arm64
            flags: -march=armv8-a -fPIC
          - arch: amd64
            platform: debian
            gcc_install: gcc g++
            gcc: gcc
            gxx: g++
          - arch: arm64
            platform: debian
            gcc_install: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            gcc: aarch64-linux-gnu-gcc
            gxx: aarch64-linux-gnu-g++

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - if: matrix.arch != 'amd64'
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y podman

      - name: Prepare build container
        run: >
          sudo podman build
          --isolation=chroot
          -t ndc-buildroot:${{ matrix.platform }}-${{ matrix.arch }}
          ./build-containers
          --file Dockerfile.${{ matrix.platform }}
          --platform linux/${{ matrix.arch }}
          --build-arg version=${{ matrix.version }}
          --build-arg node_version=${{ matrix.node-version }}
          --build-arg gcc_install="${{ matrix.gcc_install }}"

      - name: Build
        run: |
          sudo podman run --rm \
            -e TRIPLE=${{ matrix.triple_arch }}-${{ matrix.triple }}${{ matrix.triple_postfix }} \
            -e COMPILER_FLAGS="${{ matrix.flags }}" \
            -e LIBC=${{ matrix.libc }} \
            -e GCC=${{ matrix.gcc }} \
            -e GXX=${{ matrix.gxx }} \
            -e CI=true \
            -v ${{ github.workspace }}:/usr/app \
            --platform linux/${{ matrix.arch }} \
            -w /usr/app \
            ndc-buildroot:${{ matrix.platform }}-${{ matrix.arch }} \
            npx cmake-js build --CDCMAKE_TOOLCHAIN_FILE:FILEPATH=./cmake/toolchain/ci.cmake

      - name: Package Platform
        run: node scripts/prepare-platform-packages.js linux-${{ matrix.node_arch }}-${{ matrix.libc_suffix }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.node_arch }}-${{ matrix.libc_suffix }}
          path: npm/linux-${{ matrix.node_arch }}-${{ matrix.libc_suffix }}

  build-mac-arm64:
    name: macOS (darwin-arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL
        run: HOMEBREW_NO_INSTALL_CLEANUP=1 brew reinstall openssl@3
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm install --ignore-scripts
      - name: Build
        run: npx cmake-js build
        env:
          OPENSSL_ROOT_DIR: /opt/homebrew/opt/openssl@3
          OPENSSL_LIBRARIES: /opt/homebrew/opt/openssl@3/lib
      - name: Package Platform
        run: node scripts/prepare-platform-packages.js darwin-arm64
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-darwin-arm64
          path: npm/darwin-arm64

  build-mac-x64:
    name: macOS (darwin-x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm install --ignore-scripts
      - name: Build OpenSSL for macOS x64
        run: |
          git clone --depth 1 -b openssl-3.3.1 https://github.com/openssl/openssl.git _openssl_src
          cd _openssl_src
          ./Configure darwin64-x86_64-cc no-shared no-unit-test no-tests --prefix=$(pwd)/../_openssl_x64 --libdir=lib
          make -j$(sysctl -n hw.ncpu)
          make install_sw
          cd ..
      - name: Build x64 Addon
        run: |
          npx cmake-js build --arch=x64 --CDCMAKE_OSX_ARCHITECTURES=x86_64 --CDOPENSSL_ROOT_DIR="$(pwd)/_openssl_x64" --CDOPENSSL_USE_STATIC_LIBS=TRUE
      - name: Package Platform
        run: node scripts/prepare-platform-packages.js darwin-x64
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-darwin-x64
          path: npm/darwin-x64

  build-win:
    name: Windows (${{ matrix.node_arch }})
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - arch: x64
            node_arch: x64
            msvc_arch: x64
            vcpkg_triplet: x64-windows-static
            node_version: 24
          - arch: arm64
            node_arch: arm64
            msvc_arch: amd64_arm64
            vcpkg_triplet: arm64-windows-static
            node_version: 24
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Setup vcpkg
        run: |
          C:\vcpkg\bootstrap-vcpkg.bat
        shell: cmd
      - name: Install OpenSSL
        run: |
          C:\vcpkg\vcpkg install openssl:${{ matrix.vcpkg_triplet }}
        shell: cmd
      - name: Disable Pre-installed Runner OpenSSL
        run: |
          if exist "C:\Program Files\OpenSSL" ren "C:\Program Files\OpenSSL" "OpenSSL_disabled"
          if exist "C:\Program Files (x86)\OpenSSL" ren "C:\Program Files (x86)\OpenSSL" "OpenSSL_disabled"
        shell: cmd
      - name: Install Dependencies
        run: npm install --ignore-scripts
        shell: cmd
      - name: Build
        run: npx cmake-js build -a ${{ matrix.node_arch }} --CDCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" --CDVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} --CDCMAKE_PREFIX_PATH="C:\vcpkg\installed\${{ matrix.vcpkg_triplet }}"
        shell: cmd
      - name: Package Platform
        run: node scripts/prepare-platform-packages.js win32-${{ matrix.node_arch }}-msvc
        shell: cmd
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-win32-${{ matrix.node_arch }}-msvc
          path: npm/win32-${{ matrix.node_arch }}-msvc

  build-android:
    name: Android (android-arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Setup Android NDK
        run: |
          NDK_DIR=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using NDK from $NDK_DIR"

      - name: Build OpenSSL for Android arm64
        run: |
          git clone --depth 1 -b openssl-3.3.1 https://github.com/openssl/openssl.git _openssl_src
          cd _openssl_src
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          ./Configure android-arm64 -D__ANDROID_API__=24 no-shared no-unit-test no-tests --prefix=$(pwd)/../_openssl_android --libdir=lib
          make -j$(nproc)
          make install_sw
          cd ..

      - name: Build node-datachannel for Android arm64
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="$(pwd)/_openssl_android" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DOPENSSL_ROOT_DIR="$(pwd)/_openssl_android" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,undefs -Wl,--allow-shlib-undefined"
          cmake --build build-android --config Release -j$(nproc)

      - name: Package Platform
        run: |
          node scripts/prepare-platform-packages.js android-arm64 build-android/node_datachannel.node

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-android-arm64
          path: npm/android-arm64

  publish:
    name: Publish All Packages to NPM
    needs: [build-linux, build-mac-arm64, build-mac-x64, build-win, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: npm-artifacts

      - name: Publish Platform Packages
        run: |
          for dir in npm-artifacts/package-*; do
            if [ -d "$dir" ]; then
              echo "Publishing platform package from $dir..."
              cd "$dir"
              npm publish --access public
              cd - > /dev/null
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Build and Publish Main Package
        run: |
          npm install --ignore-scripts
          npm run build:tsc
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
